<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12375b"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><title>救急車 資器材点検簿</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#193047;background:#f1f5f9}*{box-sizing:border-box}body{margin:0}header{background:#12375b;color:white;padding:18px 18px 14px;position:sticky;top:0;z-index:2}header strong{font-size:19px}header small{display:block;opacity:.8;margin-top:3px}main{max-width:640px;margin:auto;padding:16px 14px 70px}.card{background:white;border:1px solid #dae2eb;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #1835520b}h2{font-size:20px;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}p{line-height:1.55}.muted{color:#607387;font-size:13px}.row{display:flex;align-items:center;gap:10px;justify-content:space-between}.pill{background:#e7f0f8;border-radius:30px;padding:5px 10px;font-size:12px;color:#12375b}button,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:12px 14px;font-weight:700}button.primary{background:#155a90;color:white}button.secondary{background:#e7edf3;color:#183552}button.danger{background:#fce9e9;color:#9e2828}button:disabled{opacity:.4;cursor:not-allowed}.full{width:100%;margin-top:10px}input,textarea{width:100%;border:1px solid #b8c7d5;border-radius:10px;padding:12px;background:white;color:#193047}label{display:block;font-size:14px;font-weight:700;margin:12px 0 6px}.place{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:white;border:1px solid #dae2eb;margin:9px 0;padding:14px}.num{background:#12375b;color:white;border-radius:9px;min-width:47px;text-align:center;padding:12px 5px;font-size:20px}.grow{flex:1}.progress{height:10px;background:#e0e7ef;border-radius:20px;overflow:hidden;margin:10px 0}.progress>div{height:100%;background:#22a178;transition:width .2s}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}.choices button{padding:12px 2px;background:#edf2f7;font-size:13px}.choices .selected.ok{background:#d5f5e4;color:#09663c}.choices .selected.missing{background:#fff0ce;color:#805500}.choices .selected.issue{background:#fbdada;color:#992424}.item{padding:14px 0;border-bottom:1px solid #e8edf3}.item:last-child{border:0}.warning{color:#a12727;font-size:13px}.footer{display:flex;gap:8px;flex-wrap:wrap}.footer button{flex:1}.hidden{display:none}a{color:#155a90}#toast{position:fixed;bottom:20px;left:10%;right:10%;background:#183552;color:white;border-radius:10px;padding:12px;text-align:center;display:none;z-index:5}.note{background:#fff6dc;border-radius:10px;padding:12px;font-size:13px;line-height:1.5}.stack>*{margin-top:9px}summary{cursor:pointer;font-weight:700}small{font-size:12px}@media(max-width:350px){.choices button{font-size:11px}}
</style></head><body><header><strong>🚑 救急車 資器材点検簿</strong><small>毎週月曜日の定期点検｜管理者パスワード付き履歴削除</small></header><main id="app"></main><div id="toast"></div><script>
const SEED=[];const KEY='ambulance-inspection-web-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){};if(!state||!Array.isArray(state.groups))state={groups:[],records:[],draft:null};let view='home',selected=null;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date().toLocaleDateString('sv-SE');const monday=()=>{let d=new Date();d.setDate(d.getDate()-(d.getDay()+6)%7);return d.toLocaleDateString('sv-SE')};const all=()=>state.groups.flatMap(g=>g.items);const saved=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('保存できませんでした。端末の空き容量やブラウザ設定を確認してください。')}};const toast=s=>{let t=$('#toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2000)};const go=(v,id)=>{view=v;selected=id??null;render();scrollTo(0,0)};const movePlace=(step)=>{const idx=state.groups.findIndex(g=>g.id===selected);const next=idx+step;if(next<0){go('places');return}if(next>=state.groups.length){go('review');return}go('place',state.groups[next].id)};const draft=()=>state.draft;const count=()=>draft()?Object.keys(draft().answers).filter(id=>all().some(i=>i.id===id)).length:0;const complete=()=>all().length>0&&all().every(i=>{let a=draft()?.answers[i.id];return a&&a.status&& (a.status!=='問題あり'||a.note?.trim())});const dweek=()=>state.records.filter(r=>r.week===monday());
function render(){const app=$('#app');let out='';if(view==='home'&&!state.groups.length){out=`<div class="card"><h2>初回設定</h2><p>この公開版には資器材一覧を含めていません。既存アプリで保存したJSONバックアップを、この端末で復元してください。</p><p class="warning">点検記録・点検者名はこの端末内に保存されます。ブラウザデータ削除に備えて定期的にバックアップしてください。</p><button class="primary full" onclick="go('backup')">バックアップから初期設定</button><button class="secondary full" onclick="go('settings')">点検項目を手入力する</button></div>`}else if(view==='home'){let r=dweek();out=`<div class="card"><h2>今週の点検</h2><div class="row"><b>${monday()}（月曜日開始の週）</b><span class="pill">${r.length?'完了記録あり':draft()?'点検中':'未実施'}</span></div><p class="muted">本日の記録日：${today()}</p>${draft()?`<div class="progress"><div style="width:${count()/Math.max(1,all().length)*100}%"></div></div><p>${count()} / ${all().length} 項目回答済み</p><p>点検者：${esc(draft().inspector)}</p><button class="primary full" onclick="go('places')">点検を再開する</button>`:`<label for="inspector">点検者氏名</label><input id="inspector" placeholder="例：中島" autocomplete="name"><button class="primary full" onclick="start()">点検を開始する</button>`}</div><div class="card stack"><button class="secondary full" onclick="go('history')">📚 過去の点検履歴</button><button class="secondary full" onclick="go('settings')">⚙️ 点検場所・資器材の編集</button><button class="secondary full" onclick="go('backup')">💾 バックアップ・復元</button></div><div class="note">この配布版は初期履歴0件です。記録をこのブラウザ内に保存します。スマホ交換・データ削除で消えるため、バックアップが必要です。QRコード共有や複数端末での記録引き継ぎは未対応です。正式運用前に組織の承認と保存方式の確認が必要です。</div>`}
else if(view==='places'){out=`<div class="row"><h2>点検場所を選択</h2><button class="secondary" onclick="go('home')">戻る</button></div><p class="muted">点検者：${esc(draft()?.inspector)} ／ ${count()} / ${all().length} 項目</p><div class="progress"><div style="width:${count()/Math.max(1,all().length)*100}%"></div></div>`+state.groups.map(g=>{let n=g.items.filter(i=>draft()?.answers[i.id]?.status).length;return `<button class="place" onclick="go('place','${g.id}')"><span class="num">${esc(g.number)}</span><span class="grow"><b>${esc(g.name)}</b><br><small class="muted">${n}/${g.items.length} 項目</small></span><b>${n===g.items.length?'✓':'›'}</b></button>`}).join('')+`<button class="primary full" onclick="go('review')">点検結果を確認・完了</button>`}
else if(view==='place'){let g=state.groups.find(g=>g.id===selected);out=`<div class="row"><h2>${esc(g.number)} ${esc(g.name)}</h2><button class="secondary" onclick="go('places')">一覧</button></div><p class="muted">選択するたび自動保存します</p><div class="card">`+g.items.map(i=>{let a=draft()?.answers[i.id]||{};return `<div class="item"><b>${esc(i.name)}</b><div class="choices">${[['有り','ok'],['無し','missing'],['問題あり','issue']].map(([v,c])=>`<button class="${c} ${a.status===v?'selected':''}" onclick="setAnswer('${i.id}','${v}')">${v}</button>`).join('')}</div>${a.status&&a.status!=='有り'?`<label for="note-${i.id}">詳細・備考 ${a.status==='問題あり'?'（必須）':'（任意）'}</label><textarea id="note-${i.id}" rows="2" placeholder="例：点検中・修理中・補充待ち" oninput="setNote('${i.id}',this.value)">${esc(a.note)}</textarea>`:''}${a.status==='問題あり'&&!a.note?.trim()?'<div class="warning">詳細の入力が必要です</div>':''}</div>`}).join('')+`</div><div class="footer"><button class="secondary" onclick="movePlace(-1)">← 前の点検場所</button><button class="primary" onclick="movePlace(1)">${state.groups.findIndex(x=>x.id===selected)===state.groups.length-1?'点検結果の確認へ →':'次の点検場所へ →'}</button></div><button class="secondary full" onclick="go('places')">場所一覧へ戻る</button>`}
else if(view==='review'){let problems=state.groups.flatMap(g=>g.items.map(i=>({g,i,a:draft()?.answers[i.id]}))).filter(x=>x.a?.status!=='有り'&&x.a?.status);out=`<div class="row"><h2>点検結果の確認</h2><button class="secondary" onclick="go('places')">戻る</button></div><div class="card"><p><b>点検者：</b>${esc(draft()?.inspector)}</p><p><b>回答：</b>${count()} / ${all().length}</p><p><b>無し・問題あり：</b>${problems.length} 件</p></div>`+(problems.length?problems.map(x=>`<div class="card"><b>${esc(x.g.number)} ${esc(x.g.name)} ／ ${esc(x.i.name)}</b><p>${esc(x.a.status)}：${esc(x.a.note||'備考なし')}</p></div>`).join(''):'<p>異常・不足の申告はありません。</p>')+`<button class="primary full" ${!complete()?'disabled':''} onclick="finish()">点検を確定して保存</button>${!complete()?'<p class="warning">未回答、または「問題あり」の詳細未入力があります。</p>':''}`}
else if(view==='history'){out=`<div class="row"><h2>点検履歴</h2><button class="secondary" onclick="go('home')">戻る</button></div><p class="muted">「無し」「問題あり」の項目だけ表示します。全項目が「有り」の場合は「異常なし」と表示します。削除には管理者パスワードが必要です。</p>`+(state.records.length?state.records.slice().reverse().map(r=>{let exceptions=(r.answers||[]).filter(a=>a.status==='無し'||a.status==='問題あり');return `<div class="card"><div class="row"><b>${esc(r.date)}　${esc(r.inspector)}</b><span class="pill">${exceptions.length?exceptions.length+'件 要確認':'異常なし'}</span></div>${exceptions.length?`<details><summary>無し・問題ありを表示（${exceptions.length}件）</summary>${exceptions.map(a=>`<p><small>${esc(a.number)} ${esc(a.place)}</small><br>${esc(a.item)}：<b>${esc(a.status)}</b>${a.note?' ／ '+esc(a.note):''}</p>`).join('')}</details>`:'<p style="color:#09663c;font-weight:700;margin-bottom:0">✓ 異常なし</p>'}<div style="margin-top:12px;text-align:right"><button class="secondary" style="color:#b42318" onclick="deleteRecord(${state.records.indexOf(r)})">🔒 この履歴を削除</button></div></div>`}).join(''):'<p class="muted">保存された点検記録はまだありません。</p>')}
else if(view==='settings'){out=`<div class="row"><h2>点検項目の編集</h2><button class="secondary" onclick="go('home')">戻る</button></div><div class="note">試作品では編集に認証がありません。正式運用時は管理者権限が必要です。編集しても確定済みの履歴は変更されません。</div><div class="card"><h3>点検場所を追加</h3><label>番号（例：⑳）</label><input id="newnumber" placeholder="⑳"><label>場所名</label><input id="newplace" placeholder="収納場所名"><button class="primary full" onclick="addPlace()">場所を追加</button></div>`+state.groups.map(g=>`<div class="card"><div class="row"><b>${esc(g.number)} ${esc(g.name)}</b><button class="secondary" onclick="editPlace('${g.id}')">編集</button></div>${g.items.map(i=>`<div class="row" style="padding:8px 0;border-bottom:1px solid #eef1f5"><span class="grow">${esc(i.name)}</span><button class="secondary" onclick="editItem('${g.id}','${i.id}')">編集</button></div>`).join('')}<button class="secondary full" onclick="addItem('${g.id}')">＋ 資器材を追加</button></div>`).join('')}
else if(view==='backup'){out=`<div class="row"><h2>バックアップ・復元</h2><button class="secondary" onclick="go('home')">戻る</button></div><div class="card"><p>点検履歴・途中の点検・場所と資器材の設定をまとめてJSONファイルに保存します。</p><button class="primary full" onclick="backup()">バックアップファイルを保存</button></div><div class="card"><h3>復元</h3><p class="warning">復元すると現在のデータはすべて置き換わります。復元前にバックアップしてください。</p><input type="file" id="restore" accept=".json,application/json"><button class="secondary full" onclick="restore()">ファイルから復元</button></div>`}app.innerHTML=out}
function deleteRecord(index){
 if(!Number.isInteger(index)||index<0||index>=state.records.length)return alert('対象の履歴が見つかりません');
 if(!state.adminPin){
   alert('初回のみ、履歴削除用の管理者パスワードを設定します。忘れないように保管してください。');
   const pin=prompt('管理者パスワードを設定（6文字以上）');
   if(pin===null)return;
   if(pin.length<6)return alert('6文字以上で設定してください');
   const again=prompt('確認のため同じパスワードを入力');
   if(again!==pin)return alert('一致しません。設定を中止しました');
   state.adminPin=pin;saved();
 }
 const entered=prompt('管理者パスワードを入力してください');
 if(entered===null)return;
 if(entered!==state.adminPin)return alert('パスワードが違います');
 const r=state.records[index];
 if(!confirm(r.date+'／'+r.inspector+' の点検履歴を削除しますか？\nこの操作は取り消せません。'))return;
 state.records.splice(index,1);saved();render();toast('指定した履歴を削除しました');
}
function start(){if(!all().length)return alert('点検項目を先に設定してください');let n=$('#inspector')?.value.trim();if(!n)return alert('点検者氏名を入力してください');state.draft={inspector:n,date:today(),week:monday(),answers:{}};saved();go('places')}
function setAnswer(id,v){let old=draft().answers[id]||{};draft().answers[id]={status:v,note:v==='有り'?'':old.note||''};saved();render()}
function setNote(id,v){draft().answers[id].note=v;saved()}
function finish(){if(!complete())return alert('未回答または詳細未入力があります');if(!confirm('この点検を確定して履歴に保存しますか？'))return;let r={date:today(),week:draft().week,inspector:draft().inspector,completedAt:new Date().toISOString(),answers:state.groups.flatMap(g=>g.items.map(i=>({number:g.number,place:g.name,item:i.name,...draft().answers[i.id]})))};state.records.push(r);state.draft=null;saved();go('home');toast('点検記録を保存しました')}
function addPlace(){let n=$('#newnumber').value.trim(),p=$('#newplace').value.trim();if(!n||!p)return alert('番号と場所名を入力してください');if(state.groups.some(g=>g.number===n))return alert('同じ番号がすでにあります。既存番号を変更せず、別の番号を指定してください');state.groups.push({id:crypto.randomUUID(),number:n,name:p,items:[]});saved();render()}
function editPlace(id){let g=state.groups.find(g=>g.id===id),n=prompt('番号',g.number);if(n===null)return;let p=prompt('場所名',g.name);if(p===null)return;n=n.trim();p=p.trim();if(!n||!p)return alert('空欄にはできません');if(state.groups.some(x=>x.id!==id&&x.number===n))return alert('番号が重複しています');g.number=n;g.name=p;saved();render()}
function addItem(id){let g=state.groups.find(g=>g.id===id),n=prompt('追加する資器材名');if(!n?.trim())return;g.items.push({id:crypto.randomUUID(),name:n.trim()});saved();render()}
function editItem(gid,id){let g=state.groups.find(g=>g.id===gid),i=g.items.find(i=>i.id===id),n=prompt('資器材名を変更（削除は次の確認から）',i.name);if(n===null)return;if(n.trim()){i.name=n.trim()}else if(confirm('この資器材を点検項目から削除しますか？確定済み履歴は残ります。')){g.items=g.items.filter(x=>x.id!==id);if(state.draft)delete state.draft.answers[id]}saved();render()}
function backup(){let blob=new Blob([JSON.stringify({format:'ambulance-inspection-v1',data:state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='救急車資器材点検_バックアップ_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function restore(){let f=$('#restore').files[0];if(!f)return alert('ファイルを選択してください');try{let obj=JSON.parse(await f.text());if(obj.format!=='ambulance-inspection-v1'||!Array.isArray(obj.data?.groups)||!Array.isArray(obj.data?.records))throw Error('形式が違います');if(!confirm('現在のデータをバックアップ内容で置き換えますか？'))return;state=obj.data;saved();go('home');toast('復元しました')}catch(e){alert('復元できません：'+e.message)}}render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('オフライン登録失敗',e)));}
</script></body></html>
